name: ClinicApi CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests with 80% coverage gate
        run: >
          dotnet test tests/ClinicApi.Tests
          --filter "Category=Unit"
          --results-directory TestResults
          --logger "trx;LogFileName=unit-results.trx"
          -p:CollectCoverage=true
          -p:Include="[ClinicApi]ClinicApi.Domain.*"
          -p:Threshold=80
          -p:ThresholdType=line

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults
          if-no-files-found: ignore

  integration:
    needs: [unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run integration tests
        run: >
          dotnet test tests/ClinicApi.Tests
          --filter "Category=Integration"
          --results-directory TestResults
          --logger "trx;LogFileName=integration-results.trx"

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults
          if-no-files-found: ignore

  e2e:
    needs: [integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/clinicapi
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build image once (load locally for E2E)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: clinicapi:ci

      - name: Start container and wait until healthy
        run: |
          docker run -d --name clinicapi -p 8080:8080 clinicapi:ci
          curl --retry 15 --retry-delay 1 --retry-all-errors -f http://localhost:8080/health

      - name: Run E2E tests against container
        env:
          BASE_URL: http://localhost:8080
        run: >
          dotnet test tests/ClinicApi.E2E.Tests
          --results-directory TestResults
          --logger "trx;LogFileName=e2e-results.trx"

      - name: Collect container logs and stop container
        if: always()
        run: |
          mkdir -p TestResults
          docker logs clinicapi > TestResults/container.log 2>&1 || true
          docker rm -f clinicapi || true

      - name: Upload E2E report and container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag clinicapi:ci "$tag"
            docker push "$tag"
          done